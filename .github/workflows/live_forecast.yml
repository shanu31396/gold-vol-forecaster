# Runs live_bot.py every hour on GitHub's servers and saves the results back into the repo.
name: Live forecast (hourly)

on:
  schedule:
    - cron: "7 * * * *"        # 7 minutes past every hour (UTC)
  workflow_dispatch:            # adds a "Run workflow" button to run it by hand

permissions:
  contents: write               # allows the robot to commit its results

concurrency:
  group: repo-writer            # never run two robots at the same time
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bot_requirements.txt
      - run: pip install -r bot_requirements.txt
      - run: python live_bot.py
        env:
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
      - name: Save results to the repo
        run: |
          git config user.name "gold-vol-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live_log live_data
          if git diff --cached --quiet; then echo "Nothing new"; exit 0; fi
          git commit -m "Live forecast update"
          git pull --rebase
          git push