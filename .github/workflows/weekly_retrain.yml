# Runs retrain_bot.py every Sunday (market closed) and saves a new model only if it is not worse.
name: Weekly retrain

on:
  schedule:
    - cron: "30 3 * * 0"       # Sunday 03:30 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-writer
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bot_requirements.txt
      - run: pip install -r bot_requirements.txt
      - run: python retrain_bot.py
      - name: Save the model to the repo
        run: |
          git config user.name "gold-vol-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model live_log
          if git diff --cached --quiet; then echo "Nothing new"; exit 0; fi
          git commit -m "Weekly retrain"
          git pull --rebase
          git push